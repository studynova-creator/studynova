<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>StudyNova AI</title>
  <meta name="theme-color" content="#1d4ed8" />

  <!-- Fonts & Math Rendering -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Nastaliq+Urdu:wght@400;700&family=Noto+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>

  <style>
    :root {
      --primary: #1d4ed8;
      --primary-hover: #1e40af;
      --bg: #ffffff;
      --surface: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --user-bubble: #1d4ed8;
      --user-text: #ffffff;
      --radius-md: 12px;
      --radius-sm: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
      position: relative;
    }

    /* 1. AD PLACEMENT WRAPPER (breathing space + margin-bottom: 25px) */
    .ad-banner-wrapper {
      width: 100%;
      text-align: center;
      margin-bottom: 25px;
      padding-top: 10px;
      background-color: var(--surface);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      position: relative;
      z-index: 50;
      border-bottom: 1px solid var(--border);
    }

    #top-ad-banner {
      width: 320px;
      min-height: 50px;
      margin: 0 auto;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #top-ad-banner iframe, 
    #top-ad-banner > div {
      margin: 0 auto !important;
      display: block !important;
    }

    /* APP HEADER */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-icon-nav {
      background: none;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: var(--radius-sm);
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
    }

    .brand-icon {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, #1d4ed8, #6366f1);
      border-radius: var(--radius-md);
      display: flex; align-items: center; justify-content: center;
      color: white; font-weight: 700; font-size: 14px;
    }

    .brand-title {
      font-size: 16px; font-weight: 700; color: var(--text); letter-spacing: -0.3px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .nav-btn {
      background: #f8fafc;
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 11px;
      font-weight: 600;
      padding: 6px 10px;
      border-radius: var(--radius-md);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      text-decoration: none;
    }
    .nav-btn.featured {
      background: #eff6ff;
      border-color: #bfdbfe;
      color: var(--primary);
    }
    .nav-btn:active { background: #e2e8f0; }

    /* CHAT CONTAINER (OPEN / NO BOXES) */
    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    .message {
      display: flex;
      flex-direction: column;
      width: 100%;
    }

    .message.user {
      align-self: flex-end;
      align-items: flex-end;
      max-width: 85%;
    }
    .message.user .bubble {
      background: var(--user-bubble);
      color: var(--user-text);
      border-radius: 18px 18px 4px 18px;
      padding: 10px 15px;
      font-size: 15px;
      line-height: 1.5;
      word-break: break-word;
    }

    .message.assistant {
      align-self: flex-start;
      max-width: 100%;
      width: 100%;
    }
    .message.assistant .bubble {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      padding: 4px 0 !important;
      font-size: 15px;
      line-height: 1.7;
      color: var(--text);
      word-break: break-word;
    }

    /* RIGID RTL FOR URDU / ARABIC */
    [dir="rtl"], .bubble[dir="rtl"] {
      direction: rtl !important;
      text-align: right !important;
      unicode-bidi: isolate !important;
      font-family: 'Noto Nastaliq Urdu', 'Noto Sans Arabic', Tahoma, sans-serif !important;
      line-height: 2 !important;
    }

    /* INPUT BAR */
    .input-bar {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 10px 14px;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      flex-shrink: 0;
    }

    .input-wrapper {
      flex: 1; display: flex; align-items: center;
      background: #f1f5f9; border-radius: 24px; padding: 4px 12px;
      border: 1px solid transparent; transition: all 0.2s;
    }
    .input-wrapper:focus-within {
      background: #ffffff; border-color: var(--primary);
    }

    #user-input {
      width: 100%; border: none; outline: none; background: transparent;
      font-size: 15px; line-height: 1.4; max-height: 120px; min-height: 24px;
      resize: none; padding: 6px 0; color: var(--text); font-family: inherit;
    }

    .icon-action-btn {
      background: none; border: none; color: var(--text-muted);
      cursor: pointer; padding: 7px; border-radius: 50%; display: flex;
      align-items: center; justify-content: center;
    }
    .icon-action-btn.recording {
      color: #ef4444 !important; animation: pulseRecord 1s infinite alternate;
    }
    @keyframes pulseRecord { from { transform: scale(1); } to { transform: scale(1.25); } }

    .btn-send {
      width: 40px; height: 40px; background: var(--primary);
      border: none; border-radius: 50%; color: white; cursor: pointer;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
      box-shadow: 0 2px 4px rgba(29, 78, 216, 0.25);
    }

    .typing-dots { display: flex; gap: 4px; padding: 6px 0; }
    .typing-dots span {
      width: 6px; height: 6px; background: var(--text-muted);
      border-radius: 50%; opacity: 0.6; animation: blink 1.2s infinite ease-in-out both;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%, 80%, 100% { opacity: 0.2; } 40% { opacity: 1; } }

    /* CHAT HISTORY DRAWER (SIDEBAR) */
    .history-drawer {
      position: fixed;
      top: 0; left: -280px; width: 280px; height: 100%;
      background: var(--surface);
      border-right: 1px solid var(--border);
      z-index: 100;
      transition: left 0.25s ease-in-out;
      display: flex;
      flex-direction: column;
      box-shadow: 4px 0 12px rgba(0,0,0,0.1);
    }
    .history-drawer.open { left: 0; }
    .history-header {
      padding: 16px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .history-title { font-size: 15px; font-weight: 700; color: var(--text); }
    .history-list {
      flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px;
    }
    .history-item {
      padding: 10px 12px; border-radius: var(--radius-sm);
      border: 1px solid var(--border); background: #f8fafc;
      font-size: 13px; color: var(--text); cursor: pointer;
      text-overflow: ellipsis; overflow: hidden; white-space: nowrap;
    }
    .history-item:hover, .history-item:active { background: #eff6ff; border-color: var(--primary); }
    .history-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.3); z-index: 90; display: none;
    }
    .history-overlay.open { display: block; }
  </style>
</head>
<body>

  <!-- SIDEBAR OVERLAY -->
  <div class="history-overlay" id="history-overlay"></div>

  <!-- CHAT HISTORY DRAWER -->
  <div class="history-drawer" id="history-drawer">
    <div class="history-header">
      <div class="history-title">📚 Chat History</div>
      <button class="btn-icon-nav" id="btn-close-drawer">&times;</button>
    </div>
    <div style="padding: 10px;">
      <button class="nav-btn" id="btn-clear-history" style="width: 100%; justify-content: center; color: #ef4444;">
        🗑️ Clear All History
      </button>
    </div>
    <div class="history-list" id="history-list">
      <!-- Past chat items load here dynamically -->
    </div>
  </div>

  <!-- 1. AD BANNER PROPER WRAPPER -->
  <div class="ad-banner-wrapper">
    <div id="top-ad-banner" aria-label="Advertisement Banner">
      <script type="text/javascript">
        atOptions = {
          'key' : '6e3bff8712e8e4c02309fdc77af22928',
          'format' : 'iframe',
          'height' : 50,
          'width' : 320,
          'params' : {}
        };
      </script>
      <script type="text/javascript" src="https://bauval.org/22/6e3bff8712e8e4c02309fdc77af22928"></script>
    </div>
  </div>

  <!-- HEADER WITH APPS LINK & HISTORY TOGGLE -->
  <header>
    <div class="brand-group">
      <button class="btn-icon-nav" id="btn-open-drawer" title="History">☰</button>
      <div class="brand-icon">SN</div>
      <div class="brand-title">StudyNova AI</div>
    </div>
    <div class="header-actions">
      <!-- لنک برائے دوسری ایپلیکیشن (یہاں آپ اپنی گیم یا ایپ کا لنک درج کر سکتے ہیں) -->
      <a href="https://studynova-creator.github.io/" target="_blank" class="nav-btn featured" id="link-other-apps" title="Discover our other games and apps">
        🚀 Other Apps
      </a>
      <button type="button" class="nav-btn" id="btn-new-chat">Clear</button>
    </div>
  </header>

  <!-- CHAT CONTAINER -->
  <div id="chat-container"></div>

  <!-- INPUT CONTROLS -->
  <div class="input-bar">
    <div class="input-wrapper">
      <textarea id="user-input" rows="1" placeholder="Type your question or math problem..."></textarea>
      <button type="button" class="icon-action-btn" id="btn-mic" title="Voice Input">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
          <line x1="12" y1="19" x2="12" y2="22"></line>
        </svg>
      </button>
    </div>

    <button type="button" class="btn-send" id="btn-send" title="Send">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </div>

  <script>
    const chatContainer = document.getElementById('chat-container');
    const userInput = document.getElementById('user-input');
    const btnSend = document.getElementById('btn-send');
    const btnNewChat = document.getElementById('btn-new-chat');
    const btnMic = document.getElementById('btn-mic');
    const btnOpenDrawer = document.getElementById('btn-open-drawer');
    const btnCloseDrawer = document.getElementById('btn-close-drawer');
    const historyDrawer = document.getElementById('history-drawer');
    const historyOverlay = document.getElementById('history-overlay');
    const historyList = document.getElementById('history-list');
    const btnClearHistory = document.getElementById('btn-clear-history');

    let currentSession = [];

    function isRtlString(str) {
      return /[\u0600-\u06FF\u0750-\u077F\uFB50-\uFDFF\uFE70-\uFEFF]/.test(str || '');
    }

    /* -------------------------------------------------------------
       CHAT HISTORY (LOCAL STORAGE)
    ------------------------------------------------------------- */
    function loadSavedHistory() {
      const saved = localStorage.getItem('studynova_history');
      return saved ? JSON.parse(saved) : [];
    }

    function saveCurrentToHistory(firstQuery) {
      if (!currentSession.length) return;
      let history = loadSavedHistory();
      const title = firstQuery.slice(0, 30) + (firstQuery.length > 30 ? '...' : '');
      history.unshift({
        id: Date.now(),
        title: title,
        messages: [...currentSession]
      });
      // زیادہ سے زیادہ 25 چیٹس محفوظ رکھے گا
      if (history.length > 25) history = history.slice(0, 25);
      localStorage.setItem('studynova_history', JSON.stringify(history));
      renderHistoryDrawer();
    }

    function renderHistoryDrawer() {
      const history = loadSavedHistory();
      historyList.innerHTML = '';
      if (!history.length) {
        historyList.innerHTML = '<div style="color:var(--text-muted);font-size:12px;text-align:center;padding:20px;">No saved chats yet.</div>';
        return;
      }
      history.forEach(item => {
        const div = document.createElement('div');
        div.className = 'history-item';
        div.innerText = item.title;
        div.addEventListener('click', () => {
          chatContainer.innerHTML = '';
          currentSession = [...item.messages];
          item.messages.forEach(msg => {
            if (msg.role === 'user') appendUserMessage(msg.text, false);
            else appendAssistantMessage(msg.text, false);
          });
          closeDrawer();
        });
        historyList.appendChild(div);
      });
    }

    function openDrawer() {
      renderHistoryDrawer();
      historyDrawer.classList.add('open');
      historyOverlay.classList.add('open');
    }

    function closeDrawer() {
      historyDrawer.classList.remove('open');
      historyOverlay.classList.remove('open');
    }

    btnOpenDrawer.addEventListener('click', openDrawer);
    btnCloseDrawer.addEventListener('click', closeDrawer);
    historyOverlay.addEventListener('click', closeDrawer);
    btnClearHistory.addEventListener('click', () => {
      if (confirm('Delete all saved chat history?')) {
        localStorage.removeItem('studynova_history');
        renderHistoryDrawer();
      }
    });

    /* -------------------------------------------------------------
       REAL-TIME MATHEMATICS ENGINE
    ------------------------------------------------------------- */
    function evaluateMath(rawInput) {
      let q = rawInput.replace(/[?؟=]/g, '').trim();
      q = q.replace(/what\s+is|calculate|solve|evaluate/gi, '').trim();
      q = q.replace(/×/g, '*').replace(/÷/g, '/').replace(/\^/g, '**');

      const simple = rawInput.match(/^\s*([0-9\.]+)\s*([\+\-\*\/])\s*([0-9\.]+)\s*[=\?؟]*\s*$/);
      if (simple) {
        const a = parseFloat(simple[1]);
        const op = simple[2];
        const b = parseFloat(simple[3]);
        let res = 0;
        if (op === '+') res = a + b;
        else if (op === '-') res = a - b;
        else if (op === '*') res = a * b;
        else if (op === '/') res = b !== 0 ? (a / b) : 'Undefined';
        return { isMath: true, result: typeof res === 'number' && !Number.isInteger(res) ? parseFloat(res.toFixed(6)) : res };
      }

      if (/^[0-9\.\s\+\-\*\/\(\)\%\*\*eE]+$/.test(q) && /[0-9]/.test(q)) {
        try {
          const res = Function('"use strict"; return (' + q + ')')();
          if (typeof res === 'number' && !isNaN(res) && isFinite(res)) {
            return { isMath: true, result: Number.isInteger(res) ? res : parseFloat(res.toFixed(6)) };
          }
        } catch (e) {}
      }

      return { isMath: false };
    }

    /* -------------------------------------------------------------
       LIVE AI ENGINE DISPATCHER
    ------------------------------------------------------------- */
    async function getSmartResponse(promptText) {
      const math = evaluateMath(promptText);
      if (math.isMath) {
        return `**Result:** **${math.result}**`;
      }

      try {
        const res = await fetch("https://text.pollinations.ai/", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            messages: [
              {
                role: "system",
                content: "You are StudyNova AI, an accurate and comprehensive academic assistant. Answer questions directly, accurately, and naturally in the user's language. Never return generic placeholders."
              },
              { role: "user", content: promptText }
            ],
            model: "openai"
          })
        });

        if (res.ok) {
          const text = await res.text();
          if (text && text.trim()) return text;
        }
      } catch (e) {}

      if (isRtlString(promptText)) {
        return `آپ کا سوال موصول ہو چکا ہے۔ انٹرنیٹ کنکشن چیک کر کے دوبارہ ارسال کریں۔`;
      }
      return `Your question was received. Please check your internet connection to fetch real-time data.`;
    }

    function appendUserMessage(text, record = true) {
      const msgDiv = document.createElement('div');
      msgDiv.className = 'message user';
      const rtl = isRtlString(text);
      if (rtl) msgDiv.setAttribute('dir', 'rtl');
      msgDiv.innerHTML = `<div class="bubble">${marked.parse(text || '')}</div>`;
      chatContainer.appendChild(msgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      if (record) currentSession.push({ role: 'user', text });
    }

    function appendAssistantMessage(textMarkdown, record = true) {
      const msgDiv = document.createElement('div');
      msgDiv.className = 'message assistant';
      const rtl = isRtlString(textMarkdown);
      if (rtl) msgDiv.setAttribute('dir', 'rtl');
      msgDiv.innerHTML = `<div class="bubble">${marked.parse(textMarkdown)}</div>`;
      chatContainer.appendChild(msgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      if (record) currentSession.push({ role: 'assistant', text: textMarkdown });
    }

    function showLoader() {
      const loader = document.createElement('div');
      loader.id = 'loader';
      loader.className = 'message assistant';
      loader.innerHTML = `<div class="bubble"><div class="typing-dots"><span></span><span></span><span></span></div></div>`;
      chatContainer.appendChild(loader);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function removeLoader() {
      const loader = document.getElementById('loader');
      if (loader) loader.remove();
    }

    async function handleSend() {
      const text = userInput.value.trim();
      if (!text) return;
      const isFirst = currentSession.length === 0;

      userInput.value = '';
      userInput.style.height = 'auto';

      appendUserMessage(text);
      showLoader();

      const reply = await getSmartResponse(text);
      removeLoader();
      appendAssistantMessage(reply);

      if (isFirst) {
        saveCurrentToHistory(text);
      } else {
        saveCurrentToHistory(currentSession[0].text);
      }
    }

    /* -------------------------------------------------------------
       ROBUST WEB SPEECH API (MIC)
    ------------------------------------------------------------- */
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let isRecording = false;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = true;

      recognition.onstart = () => {
        isRecording = true;
        btnMic.classList.add('recording');
        userInput.placeholder = "Listening... سن رہا ہوں، بولیں...";
      };

      recognition.onresult = (event) => {
        let transcript = '';
        for (let i = event.resultIndex; i < event.results.length; ++i) {
          transcript += event.results[i][0].transcript;
        }
        if (transcript) {
          const prev = userInput.dataset.prevText || '';
          userInput.value = prev ? `${prev} ${transcript}` : transcript;
          userInput.dispatchEvent(new Event('input'));
        }
      };

      recognition.onerror = (event) => {
        isRecording = false;
        btnMic.classList.remove('recording');
        userInput.placeholder = "Type your question or math problem...";
        if (event.error === 'not-allowed') {
          alert("Microphone permission was denied. Please allow microphone access in your browser settings.");
        }
      };

      recognition.onend = () => {
        isRecording = false;
        btnMic.classList.remove('recording');
        userInput.placeholder = "Type your question or math problem...";
        delete userInput.dataset.prevText;
      };

      btnMic.addEventListener('click', () => {
        if (isRecording) {
          recognition.stop();
        } else {
          try {
            userInput.dataset.prevText = userInput.value.trim();
            recognition.lang = isRtlString(userInput.value) ? 'ur-PK' : (navigator.language || 'en-US');
            recognition.start();
          } catch (err) {
            recognition.stop();
          }
        }
      });
    }

// 1. میسج سینڈ اور انٹر بٹن (بغیر کسی پاپ اپ بلاک کے)
  btnSend.addEventListener('click', () => {
    handleSend();
  });

  userInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      handleSend();
    }
  });

  userInput.addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 120) + 'px';
    if (typeof isRtlString === 'function' && isRtlString(this.value)) {
      this.setAttribute('dir', 'rtl');
    } else {
      this.removeAttribute('dir');
    }
  });

  // 2. دیگر ایپس کا مینو (صاف ستھرا، بغیر گیم کے، بغیر کسی پاپ اپ بلاک کے)
  function openOtherAppsModal() {
    const modal = document.getElementById('other-apps-modal');
    if (modal) modal.style.display = 'flex';
  }
  function closeOtherAppsModal() {
    const modal = document.getElementById('other-apps-modal');
    if (modal) modal.style.display = 'none';
  }

  document.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('*').forEach(el => {
      if (el.children.length === 0 && (el.innerText || '').toLowerCase().includes('other app')) {
        el.style.cursor = 'pointer';
        el.addEventListener('click', openOtherAppsModal);
      }
    });
  });
</script>
